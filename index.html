<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成人智力测验（韦氏结构 · 自测版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1c1c1e; --mute:#6a6a70; --line:#e2ded5;
  --acc:#1f4e79; --acc-soft:#e7eef6; --ok:#2e7d4f; --bad:#b3261e; --warn:#a15c00;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
h1,h2,h3{font-family:"Noto Serif SC",serif;font-weight:700;line-height:1.3;margin:0 0 .5em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:17px}
.wrap{max-width:860px;margin:0 auto;padding:24px 18px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.brand{font-family:"Noto Serif SC",serif;font-weight:700;font-size:16px;color:var(--acc)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{width:26px;height:6px;border-radius:3px;background:var(--line)}
.steps span.done{background:var(--acc)} .steps span.cur{background:#7ea3c7}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.mute{color:var(--mute)} .small{font-size:13px}
.btn{appearance:none;border:1px solid var(--acc);background:var(--acc);color:#fff;font:inherit;font-weight:500;padding:10px 22px;border-radius:10px;cursor:pointer;transition:transform .05s,background .15s}
.btn:hover{background:#173c5e} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--acc)} .btn.ghost:hover{background:var(--acc-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice{background:#fbf6ea;border:1px solid #eadfbf;border-radius:10px;padding:14px 16px;font-size:14px;margin:16px 0}
table.list{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}
table.list td,table.list th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.list th{font-weight:500;color:var(--mute)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px}
.qtitle{font-size:14px;color:var(--mute)}
.question{font-size:20px;margin:10px 0 20px}
.question b{font-family:"Noto Serif SC",serif}
.opts-text{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;text-align:left;font:inherit;font-size:16px;cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--ink)}
.opt:hover{border-color:var(--acc);background:var(--acc-soft)}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;background:var(--bg);font-size:12px;display:grid;place-items:center;color:var(--mute)}
.opts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:0 auto}
.opts-grid .opt{justify-content:center;flex-direction:column;padding:8px}
.opts-wide{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opts-wide .opt{justify-content:center;min-height:60px}
.timer{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0 2px}
.timer i{display:block;height:100%;background:var(--acc);width:100%;transition:width .1s linear}
.timer.low i{background:var(--bad)}
.matrix{display:grid;grid-template-columns:repeat(3,96px);gap:0;margin:8px auto 22px;width:max-content;border:1.5px solid var(--ink)}
.matrix div{width:96px;height:96px;border:1px solid #cfcac0;display:grid;place-items:center;background:#fff}
.matrix div.q{font-size:36px;font-family:"Noto Serif SC",serif;color:var(--acc);background:var(--acc-soft)}
.scales{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:16px}
.digits{font-size:84px;font-weight:700;text-align:center;height:130px;line-height:130px;font-variant-numeric:tabular-nums;color:var(--acc)}
input.ans{font:inherit;font-size:26px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;width:100%;max-width:340px;letter-spacing:4px;text-align:center}
input.ans:focus{outline:none;border-color:var(--acc)}
.center{text-align:center}
.ss-row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin:22px 0}
.ss-box{display:flex;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.ss-box.t{background:var(--acc-soft);border-color:#c5d5e6}
.glyph{width:40px;height:40px}
.yn{display:flex;gap:14px;justify-content:center}
.yn .btn{min-width:130px;font-size:18px;padding:12px}
.cd-key{display:grid;grid-template-columns:repeat(9,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;max-width:560px;margin:0 auto}
.cd-key div{text-align:center;border-right:1px solid var(--line);padding:4px 0;background:#fff}
.cd-key div:last-child{border-right:none}
.cd-key b{display:block;border-bottom:1px solid var(--line);font-size:18px}
.cd-cur{display:flex;justify-content:center;gap:10px;margin:22px 0;align-items:center}
.cd-cur span{width:54px;height:54px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:24px;color:#bbb;background:#fff}
.cd-cur span.now{width:76px;height:76px;font-size:40px;color:var(--acc);border:2px solid var(--acc);font-weight:700}
.cd-btns{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;max-width:560px;margin:0 auto}
.cd-btns button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 0;cursor:pointer}
.cd-btns button:hover{border-color:var(--acc);background:var(--acc-soft)}
.flash-bad{animation:fb .25s}
@keyframes fb{0%{background:#f7d9d6}100%{background:#fff}}
.score-big{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:10px 0 6px}
.score-big .n{font-family:"Noto Serif SC",serif;font-size:72px;line-height:1;color:var(--acc)}
.bar{position:relative;height:30px;background:#f0ede6;border-radius:8px;margin:6px 0 14px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:#9db8d3;border-radius:8px}
.bar .mid{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
.bar .lab{position:absolute;right:10px;top:4px;font-weight:700}
.dots{display:grid;grid-template-columns:120px 1fr 36px;gap:6px 10px;align-items:center;font-size:14px}
.dline{position:relative;height:18px;background:linear-gradient(90deg,#f0ede6 0 33.3%,#e6e2d8 33.3% 66.6%,#f0ede6 66.6%);border-radius:4px}
.dline i{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;background:var(--acc);transform:translateX(-50%)}
textarea.copy{width:100%;height:160px;font:13px/1.5 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:10px}
@media (max-width:600px){
  .card{padding:18px}
  .opts-text{grid-template-columns:1fr}
  .matrix{grid-template-columns:repeat(3,76px)} .matrix div{width:76px;height:76px}
  .digits{font-size:64px}
  .cd-key b{font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">成人智力测验 · 韦氏结构自测版</div>
    <div class="steps" id="steps"></div>
  </header>
  <main id="app" class="card"></main>
  <p class="small mute center" style="margin-top:14px">题目为原创仿制题，结构参照 WAIS-IV；常模为估计值，结果仅供自我了解，不构成临床或正式智力评估。</p>
</div>

<script>
/* ---------------- 基础工具 ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = mulberry32(20261119);              // 固定种子：每次测验题目相同（标准化）
const shuffle=(arr,rnd=R)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById('app');
let cleanups=[];
function clearAll(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
function onKey(fn){const h=e=>fn(e);window.addEventListener('keydown',h);cleanups.push(()=>window.removeEventListener('keydown',h))}
function later(fn,ms){const t=setTimeout(fn,ms);cleanups.push(()=>clearTimeout(t));return t}
function render(html){clearAll();app.innerHTML=html;window.scrollTo({top:0})}
function startTimer(sec,el,onEnd){
  const t0=performance.now();let dead=false;
  const iv=setInterval(()=>{
    const left=sec-(performance.now()-t0)/1000;
    if(el){el.querySelector('i').style.width=Math.max(0,left/sec*100)+'%';el.classList.toggle('low',left<sec*0.2)}
    const lab=document.getElementById('tleft'); if(lab) lab.textContent=Math.max(0,Math.ceil(left))+' 秒';
    if(left<=0&&!dead){dead=true;clearInterval(iv);onEnd()}
  },100);
  cleanups.push(()=>clearInterval(iv));
}
const store={get(){try{return JSON.parse(localStorage.getItem('wais-style-v1')||'null')}catch(e){return null}},
  set(v){try{localStorage.setItem('wais-style-v1',JSON.stringify(v))}catch(e){}},
  clear(){try{localStorage.removeItem('wais-style-v1')}catch(e){}}};

/* ---------------- 选择题通用流程 ---------------- */
function runMC(cfg,done){
  const items=cfg.items;let i=0,raw=0,miss=0;
  const show=()=>{
    if(i>=items.length||miss>=cfg.discontinue) return done(raw);
    const it=items[i];
    render(`<div class="qhead"><span class="qtitle">${cfg.title} · 第 ${i+1} / ${items.length} 题</span>${cfg.time?`<span class="qtitle" id="tleft"></span>`:''}</div>
      ${cfg.time?'<div class="timer" id="tb"><i></i></div>':''}
      <div class="question">${it.q}</div>
      <div class="${cfg.layout||'opts-text'}">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span>${o.h}</button>`).join('')}</div>`);
    const pick=k=>{const p=k==null?0:it.opts[k].p;raw+=p;miss=p===0?miss+1:0;i++;show()};
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    onKey(e=>{const n=parseInt(e.key);if(n>=1&&n<=it.opts.length)pick(n-1)});
    const t=typeof cfg.time==='function'?cfg.time(i):cfg.time;
    if(t) startTimer(t,document.getElementById('tb'),()=>pick(null));
  };
  show();
}

/* ---------------- 1 类同 ---------------- */
const SI_ITEMS=[
 ['钢琴','小提琴',[['都是乐器',2],['都能发出声音',1],['都有琴弦',1],['都很昂贵',0]]],
 ['外套','靴子',[['都是衣物 / 穿戴用品',2],['都能保暖',1],['都能在商场买到',0],['都有扣子',0]]],
 ['老鹰','鲨鱼',[['都是捕食其他动物的掠食者',2],['都是动物',1],['都很凶猛',1],['都生活在水边',0]]],
 ['地图','日历',[['都是用来定位、参照的工具（空间与时间）',2],['都可以挂在墙上',1],['都印有数字和文字',1],['都是纸做的',0]]],
 ['种子','鸡蛋',[['都能发育成新的生命',2],['都有外壳',1],['都可以吃',1],['都是圆形的',0]]],
 ['温度计','问卷',[['都是测量工具',2],['都有刻度或选项',1],['医院里都会用到',1],['都容易损坏',0]]],
 ['桥梁','翻译',[['都在两边之间起连接、沟通作用',2],['都需要专业知识',1],['都有固定长度',0],['都是现代才有的',0]]],
 ['法律','语法',[['都是约束行为或表达的规则体系',2],['都需要学习',1],['都写在书里',1],['都很复杂难懂',0]]],
 ['疫苗','消防演习',[['都是为防范未来风险而提前做的准备',2],['都和安全有关',1],['都由政府组织',0],['都让人感到不适',0]]],
 ['化石','回声',[['都是过去事件留下的痕迹或信号',2],['都能在山里找到',1],['都需要很长时间形成',0],['都和声音有关',0]]],
 ['怀疑','显微镜',[['都是深入检验、探求真相的手段',2],['科学家都会用到',1],['都能放大细节',1],['都让人不安',0]]],
 ['沉默','零',[['都表示"无"，但本身在体系中承载意义',2],['都表示什么都没有',1],['都很安静',0],['都是数学概念',0]]],
].map(([a,b,os])=>({q:`<b>${a}</b> 和 <b>${b}</b> 在哪方面相似？<div class="small mute">选择最能概括两者本质共同点的一项</div>`,opts:shuffle(os.map(([h,p])=>({h,p})))}));

/* ---------------- 2 词汇 ---------------- */
const VC_RAW=[
 ['犹豫','拿不定主意',['心情低落','动作缓慢','害怕危险']],
 ['慷慨','不吝惜财物，大方',['情绪激动','声音洪亮','态度严肃']],
 ['谨慎','对外界事物或自己言行密切注意，小心慎重',['胆小害怕','动作敏捷','守口如瓶']],
 ['敷衍','做事不负责，表面应付',['拖延时间','说谎骗人','推卸责任']],
 ['斟酌','反复考虑以决定取舍',['慢慢饮酒','讨价还价','仔细阅读']],
 ['缄默','闭口不说话',['封存文件','冷淡无情','默默承受']],
 ['蹉跎','光阴白白耽误',['走路不稳','屡次失败','言语结巴']],
 ['赧然','因难为情而脸红的样子',['愤怒的样子','惊讶的样子','明亮的样子']],
 ['偃旗息鼓','停止行动或声势',['战败投降','暗中埋伏','庆祝胜利']],
 ['觊觎','希望得到不应得的东西',['仔细观察','羡慕他人','暗中窥视']],
 ['鞭辟入里','分析透彻，切中要害',['惩罚严厉','深入敌后','文笔华丽']],
 ['罄竹难书','罪行多得写不完',['功绩极多','书籍珍贵','竹简难得']],
 ['首鼠两端','迟疑不决，动摇不定',['两面讨好','首尾呼应','胆小怕事']],
 ['耄耋','指八九十岁的高龄',['指年幼的孩童','指中年人','指去世的先人']],
 ['踽踽','孤零零独自行走的样子',['步履蹒跚的样子','结伴而行的样子','匆忙赶路的样子']],
 ['佶屈聱牙','文句艰涩，读起来不顺口',['牙齿不整齐','性格倔强','说话结巴']],
];
const VC_ITEMS=VC_RAW.map(([w,a,ds])=>({q:`<b>「${w}」</b> 的意思最接近：`,opts:shuffle([{h:a,p:1},...ds.map(h=>({h,p:0}))])}));

/* ---------------- 3 常识 ---------------- */
const IN_RAW=[
 ['一年大约有多少个星期？','52',['48','56','60']],
 ['在标准大气压下，水的沸点是多少摄氏度？','100',['90','212','120']],
 ['提出相对论的科学家是？','爱因斯坦',['牛顿','伽利略','霍金']],
 ['太阳系中最大的行星是？','木星',['土星','地球','海王星']],
 ['《红楼梦》的作者是？','曹雪芹',['施耐庵','吴承恩','罗贯中']],
 ['人体最大的器官是？','皮肤',['肝脏','大脑','肺']],
 ['澳大利亚的首都是？','堪培拉',['悉尼','墨尔本','珀斯']],
 ['南美洲最长的河流是？','亚马孙河',['巴拉那河','奥里诺科河','密西西比河']],
 ['《物种起源》的作者是？','达尔文',['孟德尔','拉马克','赫胥黎']],
 ['常见金属中导电性最好的是？','银',['铜','金','铝']],
 ['太阳光到达地球大约需要多久？','约 8 分钟',['约 8 秒','约 8 小时','约 1 天']],
 ['编制出第一张被广泛接受的化学元素周期表的是？','门捷列夫',['道尔顿','拉瓦锡','居里夫人']],
 ['血液中负责运输氧气的主要物质是？','血红蛋白',['白蛋白','胰岛素','血小板']],
 ['《神曲》的作者是？','但丁',['薄伽丘','彼特拉克','弥尔顿']],
 ['英国《大宪章》签署于哪个世纪？','13 世纪',['11 世纪','15 世纪','17 世纪']],
 ['地球赤道周长约为？','4 万公里',['4 千公里','1.2 万公里','40 万公里']],
 ['植物光合作用释放的氧气来自哪种物质？','水',['二氧化碳','葡萄糖','叶绿素']],
];
const IN_ITEMS=IN_RAW.map(([q,a,ds])=>({q,opts:shuffle([{h:a,p:1},...ds.map(h=>({h,p:0}))])}));

/* ---------------- 4 算术 ---------------- */
const AR_ITEMS=[
 ['小明有 8 个苹果，吃了 3 个，还剩几个？',5],
 ['一支笔 4 元，买 6 支一共多少元？',24],
 ['一盒有 12 个鸡蛋，3 盒一共多少个？',36],
 ['你有 45 元，买了一本 17 元的书，又买了 9 元的文具，还剩多少元？',19],
 ['一辆车每小时行驶 60 公里，2.5 小时行驶多少公里？',150],
 ['一件衣服原价 80 元，打七五折后是多少元？',60],
 ['5 名工人 6 天完成一项工程，同样效率下 3 名工人需要几天？',10],
 ['一个数的四分之三是 27，这个数是多少？',36],
 ['甲乙两人年龄之和是 50 岁，甲比乙大 8 岁，甲几岁？',29],
 ['一件商品先涨价 20%，再降价 20%，最终价格是原价的百分之几？（填数字）',96],
 ['甲水管单独 6 小时注满水池，乙水管单独 3 小时注满。两管同时开，几小时注满？',2],
 ['一列 200 米长的火车以每秒 20 米的速度通过一座 400 米长的桥，从车头上桥到车尾离桥需要多少秒？',30],
 ['笼子里有鸡和兔共 10 个头、28 只脚，兔有几只？',4],
 ['一个班男生人数是女生的 1.5 倍，全班 40 人，男生比女生多几人？',8],
 ['1000 元存入银行，年利率 10%，按复利计算，2 年后本息共多少元？',1210],
];
function runAR(done){
  let i=0,raw=0,miss=0;
  const show=()=>{
    if(i>=AR_ITEMS.length||miss>=4) return done(raw);
    const [q,a]=AR_ITEMS[i]; const T=i<10?30:45;
    render(`<div class="qhead"><span class="qtitle">算术 · 第 ${i+1} / ${AR_ITEMS.length} 题 · 心算，不用纸笔</span><span class="qtitle" id="tleft"></span></div>
      <div class="timer" id="tb"><i></i></div>
      <div class="question">${q}</div>
      <form id="f" class="row"><input class="ans" id="in" inputmode="decimal" autocomplete="off" placeholder="输入数字"><button class="btn">确定</button></form>
      <p class="small mute">按回车提交。超时自动进入下一题。</p>`);
    const inp=document.getElementById('in');inp.focus();
    let answered=false;
    const submit=v=>{if(answered)return;answered=true;const ok=v!==null&&Math.abs(parseFloat(v)-a)<1e-9;raw+=ok?1:0;miss=ok?0:miss+1;i++;show()};
    document.getElementById('f').onsubmit=e=>{e.preventDefault();if(inp.value.trim()==='')return;submit(inp.value.trim())};
    startTimer(T,document.getElementById('tb'),()=>submit(null));
  };
  show();
}

/* ---------------- 5 背数 ---------------- */
const DS_R=mulberry32(77);
function seq(n){const s=[];while(s.length<n){const d=1+Math.floor(DS_R()*9);if(d!==s[s.length-1])s.push(d)}return s}
const DS_TASKS=[
 {key:'f',name:'顺背',rule:'按<b>出现的顺序</b>输入数字',lens:[2,3,4,5,6,7,8,9],check:s=>s.join('')},
 {key:'b',name:'倒背',rule:'按<b>相反的顺序</b>输入数字',lens:[2,3,4,5,6,7,8],check:s=>s.slice().reverse().join('')},
 {key:'s',name:'排序',rule:'按<b>从小到大</b>的顺序输入数字（重复的数字也要都写出）',lens:[2,3,4,5,6,7,8,9],check:s=>s.slice().sort((a,b)=>a-b).join('')},
];
DS_TASKS.forEach(t=>t.trials=t.lens.map(n=>[seq(n),seq(n)]));
function runDS(done){
  let ti=0,raw=0;
  const startTask=()=>{
    if(ti>=DS_TASKS.length) return done(raw);
    const T=DS_TASKS[ti];
    render(`<h2>背数 · ${T.name}</h2><p>屏幕上会每秒出现一个数字。全部出现完后，${T.rule}。</p>
      ${T.key==='s'?'<p class="mute">例：看到 3 · 1 · 3 · 2，应输入 1233。</p>':T.key==='b'?'<p class="mute">例：看到 7 · 2 · 9，应输入 927。</p>':'<p class="mute">例：看到 7 · 2 · 9，应输入 729。</p>'}
      <p class="mute small">每个长度有两组，两组都错则本部分结束。</p>
      <button class="btn" id="go">开始${T.name}</button>`);
    document.getElementById('go').onclick=()=>run(0,0,0);
  };
  const run=(li,tr,failsAtLen)=>{
    const T=DS_TASKS[ti];
    if(li>=T.lens.length){ti++;return startTask()}
    const s=T.trials[li][tr];
    render(`<div class="qhead"><span class="qtitle">背数 · ${T.name} · ${s.length} 位数（第 ${tr+1} 组）</span></div><div class="digits" id="d"></div><div id="inp" class="center"></div>`);
    const d=document.getElementById('d');let k=0;
    const step=()=>{
      if(k<s.length){d.textContent=s[k];later(()=>{d.textContent='';k++;later(step,250)},750)}
      else{
        d.innerHTML='<span style="font-size:22px;color:var(--mute)">请输入</span>';
        document.getElementById('inp').innerHTML=`<form id="f" class="row" style="justify-content:center"><input class="ans" id="in" inputmode="numeric" autocomplete="off"><button class="btn">确定</button></form>`;
        const inp=document.getElementById('in');inp.focus();
        document.getElementById('f').onsubmit=e=>{e.preventDefault();
          const ok=inp.value.replace(/\D/g,'')===T.check(s);if(ok)raw++;
          const f=failsAtLen+(ok?0:1);
          if(tr===0) run(li,1,f);
          else if(f>=2){ti++;startTask()}
          else run(li+1,0,0);
        };
      }
    };
    later(step,600);
  };
  startTask();
}

/* ---------------- 6 矩阵推理 ---------------- */
const SHAPES=['circle','square','triangle','diamond','hexagon','arrow','star'];
const FILLS=['#ffffff','#9aa3ad','#1d1d1f'];
function shapeEl(name,r,fill){
  const st=`fill="${fill}" stroke="#1d1d1f" stroke-width="2" stroke-linejoin="round"`;
  const poly=pts=>`<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" ${st}/>`;
  switch(name){
    case 'circle':return `<circle r="${r}" ${st}/>`;
    case 'square':return `<rect x="${-r*.8}" y="${-r*.8}" width="${r*1.6}" height="${r*1.6}" ${st}/>`;
    case 'triangle':return poly([[0,-r],[.87*r,.5*r],[-.87*r,.5*r]]);
    case 'diamond':return poly([[0,-r],[.72*r,0],[0,r],[-.72*r,0]]);
    case 'hexagon':return poly([...Array(6)].map((_,i)=>[r*Math.cos(Math.PI/3*i),r*Math.sin(Math.PI/3*i)]));
    case 'arrow':return poly([[0,-r],[.75*r,-.05*r],[.28*r,-.05*r],[.28*r,r],[-.28*r,r],[-.28*r,-.05*r],[-.75*r,-.05*r]]);
    case 'star':return poly([...Array(10)].map((_,i)=>{const a=-Math.PI/2+Math.PI/5*i,rr=i%2?r*.45:r;return[rr*Math.cos(a),rr*Math.sin(a)]}));
  }
}
function cellSVG(o,px=80){
  const pos={1:[[40,40]],2:[[23,40],[57,40]],3:[[40,22],[21,57],[59,57]]}[o.count];
  const r={1:25,2:15,3:13}[o.count]*[.55,.78,1][o.size];
  return `<svg width="${px}" height="${px}" viewBox="0 0 80 80">${pos.map(([x,y])=>`<g transform="translate(${x} ${y}) rotate(${o.rot*90})">${shapeEl(SHAPES[o.shape],r,FILLS[o.fill])}</g>`).join('')}</svg>`;
}
const ADD=[[1,1,2],[2,1,3],[1,2,3]];
const ATTRS=['shape','count','fill','size','rot'];
const DEF={shape:0,count:1,fill:2,size:2,rot:0};
const MR_SPECS=[
 {count:{t:'prog',v:[1,2,3]}},
 {shape:{t:'latin',v:[0,1,2],d:1,o:0}},
 {shape:1,fill:{t:'prog',v:[0,1,2]}},
 {count:{t:'prog',v:[1,2,3]},shape:{t:'row',v:[2,3,4]}},
 {shape:{t:'latin',v:[0,1,3],d:1,o:0},fill:{t:'prog',v:[0,1,2]}},
 {shape:5,rot:{t:'latin',v:[0,1,2],d:1,o:0},count:{t:'row',v:[1,2,3]}},
 {shape:3,size:{t:'prog',v:[0,1,2]},fill:{t:'latin',v:[0,1,2],d:2,o:0}},
 {count:{t:'latin',v:[1,2,3],d:1,o:0},shape:{t:'latin',v:[0,1,2],d:2,o:0}},
 {shape:{t:'latin',v:[1,2,4],d:1,o:0},fill:{t:'latin',v:[0,1,2],d:2,o:1},count:{t:'prog',v:[1,2,3]}},
 {shape:5,rot:{t:'latin',v:[0,1,3],d:2,o:0},fill:{t:'latin',v:[0,1,2],d:1,o:1},count:{t:'latin',v:[1,2,3],d:1,o:2}},
 {size:{t:'latin',v:[0,1,2],d:1,o:0},shape:{t:'latin',v:[0,3,4],d:2,o:0},fill:{t:'prog',v:[0,1,2]},count:2},
 {shape:5,count:{t:'latin',v:[1,2,3],d:1,o:0},fill:{t:'latin',v:[0,1,2],d:2,o:0},rot:{t:'latin',v:[0,1,2],d:1,o:1}},
 {shape:{t:'latin',v:[1,2,6],d:1,o:0},count:{t:'latin',v:[1,2,3],d:2,o:1},fill:{t:'latin',v:[0,1,2],d:1,o:2},size:{t:'prog',v:[0,1,2]}},
 {shape:{t:'latin',v:[0,2,4],d:2,o:0},count:{t:'latin',v:[1,2,3],d:1,o:1},fill:{t:'latin',v:[0,1,2],d:2,o:1},size:{t:'latin',v:[0,1,2],d:1,o:2}},
 {count:{t:'add'},shape:{t:'latin',v:[1,3,6],d:1,o:0},fill:{t:'latin',v:[0,1,2],d:2,o:2}},
 {count:{t:'add'},shape:{t:'latin',v:[0,2,3],d:2,o:0},fill:{t:'latin',v:[0,1,2],d:1,o:1},size:{t:'latin',v:[0,1,2],d:2,o:2}},
];
function mrValue(rule,r,c){
  if(typeof rule==='number')return rule;
  switch(rule.t){case 'prog':return rule.v[c];case 'row':return rule.v[r];case 'latin':return rule.v[(c+rule.d*r+rule.o)%3];case 'add':return ADD[r][c]}
}
const DOMAIN={shape:[0,1,2,3,4,6],count:[1,2,3],fill:[0,1,2],size:[0,1,2],rot:[0,1,2,3]};
function buildMR(spec){
  const rules={};ATTRS.forEach(a=>rules[a]=spec[a]!==undefined?spec[a]:DEF[a]);
  const cell=(r,c)=>{const o={};ATTRS.forEach(a=>o[a]=mrValue(rules[a],r,c));return o};
  const grid=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)grid.push(cell(r,c));
  const ans=grid[8];const key=o=>ATTRS.map(a=>o[a]).join('-');
  const varying=ATTRS.filter(a=>typeof rules[a]!=='number');
  const alts=a=>{
    if(a==='rot') return varying.includes('rot')?[0,1,2,3].filter(v=>v!==ans.rot):[];
    if(a==='shape'&&rules.shape===5) return [];
    const base=typeof rules[a]==='number'?DOMAIN[a]:(rules[a].v||[1,2,3]).concat(DOMAIN[a]);
    return [...new Set(base)].filter(v=>v!==ans[a]&&!(a==='shape'&&v===5));
  };
  const one=a=>shuffle(alts(a)).map(v=>({...ans,[a]:v}));
  const Cv=shuffle(varying.flatMap(a=>one(a)));
  const Cc=shuffle(ATTRS.filter(a=>!varying.includes(a)).flatMap(a=>one(a)));
  const Ct=[];for(const a of varying)for(const b of ATTRS)if(a!==b)for(const v of alts(a).slice(0,2))for(const w of alts(b).slice(0,2))Ct.push({...ans,[a]:v,[b]:w});
  const seen=new Set([key(ans)]);const out=[];
  const take=(list,lim)=>{for(const o of list){if(out.length>=lim)break;if(!seen.has(key(o))){seen.add(key(o));out.push(o)}}};
  take(Cv,3);take(shuffle(Ct),4);take(Cc,5);take(Cv,5);take(shuffle(Ct),5);
  const opts=shuffle([{o:ans,p:1},...out.map(o=>({o,p:0}))]);
  return {grid,opts};
}
const MR_ITEMS=MR_SPECS.map(s=>{const {grid,opts}=buildMR(s);
  return {q:`<div class="small mute">哪一个选项最适合填入问号处？</div><div class="matrix">${grid.map((o,k)=>k===8?'<div class="q">?</div>':`<div>${cellSVG(o)}</div>`).join('')}</div>`,
    opts:opts.map(x=>({h:cellSVG(x.o,72),p:x.p}))}});

/* ---------------- 7 图形重量 ---------------- */
const FW_COL={R:'#d9534f',B:'#3a7bd5',G:'#3fa34d',Y:'#e0b000'};
function fwShape(c,x,y){
  const st=`fill="${FW_COL[c]}" stroke="#1d1d1f" stroke-width="1.5"`;
  if(c==='R')return `<circle cx="${x}" cy="${y}" r="9" ${st}/>`;
  if(c==='B')return `<rect x="${x-8.5}" y="${y-8.5}" width="17" height="17" ${st}/>`;
  if(c==='G')return `<polygon points="${x},${y-10} ${x+10},${y+8} ${x-10},${y+8}" ${st}/>`;
  return `<polygon points="${x},${y-10} ${x+8},${y} ${x},${y+10} ${x-8},${y}" ${st}/>`;
}
function fwGroup(s,cx,cy){const n=s.length,sp=22;return [...s].map((c,i)=>fwShape(c,cx+(i-(n-1)/2)*sp,cy)).join('')}
function fwScale(l,r,q){
  return `<svg width="360" height="74" viewBox="0 0 360 74"><line x1="20" y1="48" x2="340" y2="48" stroke="#1d1d1f" stroke-width="2.5"/>
   <polygon points="180,48 168,70 192,70" fill="#c9c4b8" stroke="#1d1d1f" stroke-width="1.5"/>
   ${fwGroup(l,98,34)}${q?'<text x="262" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f4e79">?</text>':fwGroup(r,262,34)}</svg>`;
}
function fwOpt(s){const w=Math.max(60,s.length*22+16);return `<svg width="${w}" height="30" viewBox="0 0 ${w} 30">${fwGroup(s,w/2,15)}</svg>`}
const FW_RAW=[
 {w:{R:2,B:1},eq:[['R','BB']],t:'RR',o:['BBBB','BBB','BB','BBBBB','RB']},
 {w:{R:3,B:1},eq:[['R','BBB']],t:'RB',o:['BBBB','BBB','BBBBB','RR','BB']},
 {w:{R:4,B:2,G:1},eq:[['R','BB'],['B','GG']],t:'R',o:['GGGG','GG','GGG','BGGG','GGGGGG']},
 {w:{R:2,B:3},eq:[['RRR','BB']],t:'RRRRRR',o:['BBBB','BBB','BBBBB','RRRB','BBRR']},
 {w:{B:1,G:2,R:3},eq:[['R','BG'],['G','BB']],t:'R',o:['BBB','BB','BBBB','GG','RB']},
 {w:{B:2,G:3,R:6},eq:[['R','BBB'],['GG','R']],t:'GGGG',o:['RR','RBB','BBBBB','GGGB','RG']},
 {w:{R:3,B:2,G:1},eq:[['RR','BBB'],['B','GG']],t:'RB',o:['BBG','BBB','RG','RR','BGG']},
 {w:{Y:1,B:2,G:3,R:5},eq:[['R','BG'],['G','BY'],['B','YY']],t:'RG',o:['BBBB','BBB','GGG','RYY','GGYYY']},
 {w:{R:4,B:3,G:2,Y:1},eq:[['R','GG'],['G','YY'],['B','GY']],t:'RB',o:['GGGY','GGGG','BBB','RY','GGY']},
 {w:{R:5,B:3,G:2},eq:[['RB','GGGG'],['BB','GGG']],t:'RR',o:['GGGGG','GGGG','BBB','RGG','BGGGG']},
 {w:{R:6,B:4,G:3,Y:2},eq:[['GG','R'],['B','YY'],['RY','BB']],t:'RB',o:['GGYY','GGGY','RG','BBB','GYYY']},
 {w:{R:7,B:5,G:3,Y:2},eq:[['B','GY'],['R','BY'],['YYY','GG']],t:'RG',o:['BB','BG','RY','GGG','BYYY']},
];
const FW_ITEMS=FW_RAW.map(it=>({
  q:`<div class="small mute">上面的天平都是平衡的。哪一个选项能让最下面的天平平衡？</div><div class="scales">${it.eq.map(([l,r])=>fwScale(l,r)).join('')}<div style="border-top:1px dashed var(--line);width:360px;margin:4px 0"></div>${fwScale(it.t,'',true)}</div>`,
  opts:shuffle(it.o.map((s,k)=>({h:fwOpt(s),p:k===0?1:0})))}));

/* ---------------- 符号生成（符号检索 / 译码）---------------- */
const G_R=mulberry32(4242);
const GP=[[6,6],[20,6],[34,6],[6,20],[20,20],[34,20],[6,34],[20,34],[34,34]];
const SEGS=[];for(let i=0;i<9;i++)for(let j=i+1;j<9;j++){const dx=Math.abs(GP[i][0]-GP[j][0]),dy=Math.abs(GP[i][1]-GP[j][1]);if(dx<=14&&dy<=14)SEGS.push([i,j])}
function makeGlyphs(n){const out=[],seen=new Set();while(out.length<n){const k=3+Math.floor(G_R()*2);const s=shuffle(SEGS.map((_,i)=>i),G_R).slice(0,k).sort((a,b)=>a-b);const key=s.join(',');if(!seen.has(key)){seen.add(key);out.push(s)}}return out}
function glyphSVG(g,cls='glyph'){return `<svg class="${cls}" viewBox="0 0 40 40">${g.map(si=>{const[a,b]=SEGS[si];return `<line x1="${GP[a][0]}" y1="${GP[a][1]}" x2="${GP[b][0]}" y2="${GP[b][1]}" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>`}).join('')}</svg>`}
const SS_POOL=makeGlyphs(18), CD_GLYPHS=makeGlyphs(9);
const SS_ROWS=[...Array(80)].map(()=>{const p=shuffle(SS_POOL.map((_,i)=>i),G_R);const t=p.slice(0,2),s=p.slice(2,7);const yes=G_R()<.5;if(yes)s[Math.floor(G_R()*5)]=t[Math.floor(G_R()*2)];return{t,s,yes}});
const CD_SEQ=[...Array(160)].map(()=>1+Math.floor(G_R()*9));
const CD_BTN_ORDER=shuffle([1,2,3,4,5,6,7,8,9],G_R);

/* ---------------- 8 符号检索 ---------------- */
function runSS(done){
  render(`<h2>符号检索</h2><p>每一行左侧有 <b>2 个目标符号</b>（蓝底），右侧有 5 个符号。判断右侧是否出现了任一目标符号。</p>
   <div class="ss-row"><div class="ss-box t">${glyphSVG(SS_POOL[0])}${glyphSVG(SS_POOL[1])}</div><div class="ss-box">${[2,3,1,4,5].map(i=>glyphSVG(SS_POOL[i])).join('')}</div><span class="tag">答案：是</span></div>
   <p>键盘：<b>F = 是</b>，<b>J = 否</b>（也可点击按钮）。限时 <b>120 秒</b>，又快又准。得分 = 答对数 − 答错数。</p>
   <button class="btn" id="go">开始（120 秒）</button>`);
  document.getElementById('go').onclick=()=>{
    let i=0,right=0,wrong=0;
    render(`<div class="qhead"><span class="qtitle">符号检索 · 第 <span id="n">1</span> 行</span><span class="qtitle" id="tleft"></span></div><div class="timer" id="tb"><i></i></div>
      <div id="rowbox"></div><div class="yn"><button class="btn" id="y">是 (F)</button><button class="btn ghost" id="no">否 (J)</button></div>`);
    const box=document.getElementById('rowbox');
    const draw=()=>{const r=SS_ROWS[i];document.getElementById('n').textContent=i+1;box.innerHTML=`<div class="ss-row"><div class="ss-box t">${r.t.map(k=>glyphSVG(SS_POOL[k])).join('')}</div><div class="ss-box">${r.s.map(k=>glyphSVG(SS_POOL[k])).join('')}</div></div>`};
    let over=false;const end=()=>{if(over)return;over=true;done(Math.max(0,right-wrong))};
    const ans=v=>{if(over)return;(SS_ROWS[i].yes===v)?right++:wrong++;i++;if(i>=SS_ROWS.length)return end();draw()};
    document.getElementById('y').onclick=()=>ans(true);document.getElementById('no').onclick=()=>ans(false);
    onKey(e=>{const k=e.key.toLowerCase();if(k==='f')ans(true);else if(k==='j')ans(false)});
    draw();startTimer(120,document.getElementById('tb'),end);
  };
}

/* ---------------- 9 译码 ---------------- */
function runCD(done){
  const key=`<div class="cd-key">${[1,2,3,4,5,6,7,8,9].map(d=>`<div><b>${d}</b>${glyphSVG(CD_GLYPHS[d-1])}</div>`).join('')}</div>`;
  render(`<h2>译码</h2><p>上方的对照表中，每个数字对应一个符号。屏幕中间会依次出现数字，请在下方按钮里点出它对应的符号。</p>${key}
   <p style="margin-top:14px">下方按钮的顺序<b>与对照表不同</b>，需要边查边找。限时 <b>120 秒</b>，得分 = 正确个数。</p><button class="btn" id="go">开始（120 秒）</button>`);
  document.getElementById('go').onclick=()=>{
    let i=0,right=0,over=false;
    render(`<div class="qhead"><span class="qtitle">译码 · 已完成 <span id="n">0</span></span><span class="qtitle" id="tleft"></span></div><div class="timer" id="tb"><i></i></div>
      ${key}<div class="cd-cur" id="cur"></div>
      <div class="cd-btns">${CD_BTN_ORDER.map(d=>`<button data-d="${d}">${glyphSVG(CD_GLYPHS[d-1])}</button>`).join('')}</div>`);
    const cur=document.getElementById('cur');
    const draw=()=>{cur.innerHTML=[0,1,2,3].map(k=>CD_SEQ[i+k]?`<span class="${k===0?'now':''}">${CD_SEQ[i+k]}</span>`:'').join('');document.getElementById('n').textContent=i};
    const end=()=>{if(over)return;over=true;done(right)};
    app.querySelectorAll('.cd-btns button').forEach(b=>b.onclick=()=>{if(over)return;
      if(+b.dataset.d===CD_SEQ[i])right++;else{cur.firstChild.classList.add('flash-bad')}
      i++;if(i>=CD_SEQ.length)return end();draw()});
    draw();startTimer(120,document.getElementById('tb'),end);
  };
}

 {id:'FW',name:'图形重量',idx:'PRI',desc:'根据已平衡的天平推断未知天平的答案。共 12 题，前 6 题每题 30 秒，后 6 题每题 45 秒；连续 4 题错误则提前结束。',max:12,m:7,sd:2.8,
   run:d=>runMC({title:'图形重量',items:FW_ITEMS,discontinue:4,time:i=>i<6?30:45,layout:'opts-wide'},d)},
 {id:'IN',name:'常识',idx:'VCI',desc:'常识与知识面问题。共 17 题，不限时；连续 4 题错误则提前结束。请勿查阅资料。',max:17,m:10.5,sd:3,
   run:d=>runMC({title:'常识',items:IN_ITEMS,discontinue:4},d)},
 {id:'CD',name:'译码',idx:'PSI',desc:'按对照表把数字转换成符号。限时 120 秒。',max:160,m:52,sd:12,run:runCD},
];
const INDEX={VCI:{name:'言语理解',en:'VCI',about:'概念形成、言语推理与习得知识'},
             PRI:{name:'知觉推理',en:'PRI',about:'非言语的流体推理、规律发现'},
             WMI:{name:'工作记忆',en:'WMI',about:'在头脑中暂存并操作信息'},
             PSI:{name:'加工速度',en:'PSI',about:'简单视觉信息的扫描与处理速度'}};

const scaled=(t,raw)=>Math.max(1,Math.min(19,Math.round(10+3*(raw-t.m)/t.sd)));
function composite(ss,r){const k=ss.length,mean=ss.reduce((a,b)=>a+b,0)/k;const sdm=3*Math.sqrt((1+(k-1)*r)/k);return Math.max(40,Math.min(160,Math.round(100+15*(mean-10)/sdm)))}
function ncdf(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function category(iq){if(iq>=130)return'极优秀';if(iq>=120)return'优秀';if(iq>=110)return'中上';if(iq>=90)return'中等';if(iq>=80)return'中下';if(iq>=70)return'临界';return'偏低'}

/* ---------------- 流程 ---------------- */
let state={idx:0,results:{}};
function drawSteps(){document.getElementById('steps').innerHTML=SUBTESTS.map((t,i)=>`<span title="${t.name}" class="${state.results[t.id]!==undefined?'done':i===state.idx?'cur':''}"></span>`).join('')}

function intro(){
  drawSteps();
  const saved=store.get();
  render(`<h1>成人智力测验</h1>
   <p class="mute">按韦氏成人智力量表（WAIS-IV）的结构设计：4 个指数、9 个分测验，最后给出全量表估算分数。</p>
   <div class="notice"><b>测试前请知悉</b><br>
   · 正式的韦氏测验题目受版权与测验保密保护，必须由受训施测者一对一进行，不能在线自测。本页所有题目均为<b>原创仿制题</b>，题型与计分规则参照 WAIS-IV。<br>
   · 原测验中需要实物操作的「积木」「视觉拼图」无法在线实现，以「图形重量」代替。<br>
   · 常模（普通成人的平均表现）是估计值，没有经过标准化样本校准，所以结果只是<b>大致参考</b>，误差可能有 ±10 分以上。</div>
   <table class="list"><tr><th>#</th><th>分测验</th><th>指数</th><th>说明</th></tr>
   ${SUBTESTS.map((t,i)=>`<tr><td>${i+1}</td><td>${t.name}</td><td><span class="tag">${INDEX[t.idx].name}</span></td><td class="mute">${t.desc}</td></tr>`).join('')}</table>
   <p><b>准备：</b>约 35–45 分钟，安静环境，建议用电脑（有键盘）。不要用纸笔、计算器或搜索。中途关闭页面，已完成的分测验会保留在本浏览器中。</p>
   <div class="row">
   ${saved&&Object.keys(saved.results||{}).length&&saved.idx<SUBTESTS.length?`<button class="btn" id="resume">继续上次进度（已完成 ${Object.keys(saved.results).length} 项）</button><button class="btn ghost" id="start">重新开始</button>`:`<button class="btn" id="start">开始测验</button>`}
   ${saved&&saved.idx>=SUBTESTS.length?'<button class="btn ghost" id="last">查看上次结果</button>':''}
   </div>`);
  const s=document.getElementById('start');if(s)s.onclick=()=>{state={idx:0,results:{}};store.set(state);preface()};
  const r=document.getElementById('resume');if(r)r.onclick=()=>{state=saved;preface()};
  const l=document.getElementById('last');if(l)l.onclick=()=>{state=saved;results()};
}
function preface(){
  if(state.idx>=SUBTESTS.length)return results();
  drawSteps();const t=SUBTESTS[state.idx];
  render(`<div class="qtitle">第 ${state.idx+1} / ${SUBTESTS.length} 项 · <span class="tag">${INDEX[t.idx].name}</span></div>
    <h2 style="margin-top:8px">${t.name}</h2><p>${t.desc}</p>
    ${['SI','VC','IN','MR','FW'].includes(t.id)?'<p class="mute small">可以用数字键 1–6 快速作答。</p>':''}
    <button class="btn" id="go">${['DS','SS','CD'].includes(t.id)?'查看说明':'开始'}</button>`);
  document.getElementById('go').onclick=()=>t.run(raw=>{state.results[t.id]=raw;state.idx++;store.set(state);preface()});
}
function results(){
  drawSteps();
  const sc={};SUBTESTS.forEach(t=>sc[t.id]=scaled(t,state.results[t.id]||0));
  const idx={};Object.keys(INDEX).forEach(k=>{const ss=SUBTESTS.filter(t=>t.idx===k).map(t=>sc[t.id]);idx[k]=composite(ss,.65)});
  const fsiq=composite(Object.values(sc),.5);
  const pct=ncdf((fsiq-100)/15)*100;
  const pctTxt=pct>99.5?'> 99.5':pct<0.5?'< 0.5':pct.toFixed(pct>=99||pct<1?1:0);
  const lo=fsiq-10,hi=fsiq+10;
  const pos=v=>((v-40)/120*100).toFixed(1);
  const strong=Object.entries(idx).sort((a,b)=>b[1]-a[1]);
  const spread=strong[0][1]-strong[3][1];
  const txt=`成人智力测验（韦氏结构自测版）结果\n全量表估算 IQ：${fsiq}（大致区间 ${lo}–${hi}，${category(fsiq)}，约超过 ${pctTxt}% 的人）\n`+
    Object.entries(idx).map(([k,v])=>`${INDEX[k].name} ${k}：${v}`).join('\n')+'\n分测验（原始分 → 量表分）：\n'+
    SUBTESTS.map(t=>`${t.name}：${state.results[t.id]}/${t.max} → ${sc[t.id]}`).join('\n');
  render(`<div class="qtitle">测验完成</div><h1 style="margin-top:6px">你的结果</h1>
   <div class="score-big"><div class="n">${fsiq}</div><div><div><b>全量表智商估算（FSIQ）</b></div><div class="mute">等级：${category(fsiq)} · 约超过 ${pctTxt}% 的成年人 · 大致区间 ${lo}–${hi}</div></div></div>
   <div class="bar"><div class="fill" style="width:${pos(fsiq)}%"></div><div class="mid" style="left:${pos(100)}%"></div><span class="lab">${fsiq}</span></div>
   <p class="small mute" style="margin-top:-8px">刻度 40–160，竖线为平均值 100；平均 100、标准差 15。</p>

   <h3 style="margin-top:26px">四项指数</h3>
   ${Object.entries(idx).map(([k,v])=>`<div class="row" style="justify-content:space-between"><span><b>${INDEX[k].name}</b> <span class="mute small">${k} · ${INDEX[k].about}</span></span><span class="mute small">${category(v)}</span></div>
     <div class="bar"><div class="fill" style="width:${pos(v)}%"></div><div class="mid" style="left:${pos(100)}%"></div><span class="lab">${v}</span></div>`).join('')}
   <p>${spread>=23?`各指数之间差距较大（最高「${INDEX[strong[0][0]].name}」与最低「${INDEX[strong[3][0]].name}」相差 ${spread} 分）。在正式测评中，指数差异这么大时，单一的总分代表性会下降，解读时更应看各项指数的轮廓。`:
     `相对强项是「${INDEX[strong[0][0]].name}」，相对弱项是「${INDEX[strong[3][0]].name}」，相差 ${spread} 分，整体轮廓比较均衡，总分有较好的代表性。`}</p>

   <h3 style="margin-top:26px">分测验量表分 <span class="mute small">（1–19，平均 10，中间带为 7–13 的常见范围）</span></h3>
   <div class="dots">${SUBTESTS.map(t=>`<span>${t.name} <span class="mute small">${state.results[t.id]}/${t.max}</span></span><div class="dline"><i style="left:${((sc[t.id]-1)/18*100).toFixed(1)}%"></i></div><b>${sc[t.id]}</b>`).join('')}</div>

   <div class="notice" style="margin-top:24px"><b>怎么理解这个分数</b><br>
   这是一个仿韦氏结构的自测，题目是原创的、常模是估计的，在线环境（键盘鼠标、屏幕阅读）也和正式施测不同，尤其「加工速度」受设备影响较大。把它当成对自己认知轮廓的粗略了解即可。如果需要正式结果（比如用于诊断、教育或法律用途），请找有资质的心理测评机构做标准化的 WAIS-IV。</div>

   <div class="row" style="margin-top:12px"><button class="btn" id="copy">复制结果文本</button><button class="btn ghost" id="again">重新测验</button></div>
   <div id="copybox"></div>`);
  document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);document.getElementById('copy').textContent='已复制'}catch(e){document.getElementById('copybox').innerHTML=`<p class="small mute">无法自动复制，请手动选择下面的文字：</p><textarea class="copy">${txt}</textarea>`}};
  document.getElementById('again').onclick=()=>{store.clear();state={idx:0,results:{}};intro()};
}
intro();
</script>
</body>
</html>
